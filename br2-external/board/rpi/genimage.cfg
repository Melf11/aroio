image boot.vfat {
  vfat {
    # firmware and shared settings; kernel, device trees, overlays and cmdline.txt per slot
    # (slot-a/ from this build, slot-b/ is written by the first update, see rauc-tryboot)
    files = { "rpi-firmware/bootcode.bin", "rpi-firmware/start.elf", "rpi-firmware/fixup.dat",
              "rpi-firmware/start4.elf", "rpi-firmware/fixup4.dat", "rpi-firmware/config.txt", "aroio.txt" }
    file slot-a { image = "slot-a" }
  }
  # room for two slots (kernel 25 MB each) and firmware
  size = 128M
}

# empty data partition (only the contents of /data, which is empty in the image);
# it grows to the card size on first boot (aroio-grow-data + x-systemd.growfs)
image data.ext4 {
  mountpoint = "/data"
  ext4 { label = "data" use-mke2fs = true }
  size = 64M
}

image sdcard.img {
  hdimage { partition-table-type = "mbr" }
  partition boot { partition-type = 0xC bootable = "true" image = "boot.vfat" }
  partition rootfsA { partition-type = 0x83 image = "rootfs.squashfs" size = 256M }
  partition rootfsB { partition-type = 0x83 size = 256M }
  partition data { partition-type = 0x83 image = "data.ext4" }
}
