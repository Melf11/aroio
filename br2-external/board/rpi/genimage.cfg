image boot.vfat {
  vfat {
    files = { "bcm2710-rpi-3-b.dtb", "bcm2710-rpi-3-b-plus.dtb", "bcm2711-rpi-4-b.dtb", "bcm2711-rpi-cm4.dtb",
              "bcm2712-rpi-5-b.dtb", "bcm2712-rpi-cm5-cm5io.dtb", "rpi-firmware/bootcode.bin",
              "rpi-firmware/start.elf", "rpi-firmware/fixup.dat", "rpi-firmware/start4.elf", "rpi-firmware/fixup4.dat",
              "rpi-firmware/config.txt", "rpi-firmware/cmdline.txt", "rpi-firmware/overlays", "aroio.txt", "Image" }
  }
  size = 128M
}

# empty data partition (only the contents of /data, which is empty in the image);
# it grows to the card size on first boot (phase 1)
image data.ext4 {
  mountpoint = "/data"
  ext4 { label = "data" use-mke2fs = true }
  size = 64M
}

image sdcard.img {
  hdimage { partition-table-type = "mbr" }
  partition boot { partition-type = 0xC bootable = "true" image = "boot.vfat" }
  partition rootfsA { partition-type = 0x83 image = "rootfs.squashfs" size = 512M }
  partition rootfsB { partition-type = 0x83 size = 512M }
  partition data { partition-type = 0x83 image = "data.ext4" }
}
