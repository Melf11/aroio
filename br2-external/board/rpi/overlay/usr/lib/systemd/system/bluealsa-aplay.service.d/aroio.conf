# Bluetooth audio into the ALSA loopback (plughw adapts format and rate to CamillaDSP).
# Start after BlueALSA itself, otherwise the player finds no service at boot.
[Unit]
After=bluealsa.service
Wants=bluealsa.service

[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay -S --volume=none --pcm=plughw:Loopback,0,0
Restart=always
RestartSec=2
