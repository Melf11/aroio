# The Pi has no clock battery: timesyncd keeps the last known time in its state
# directory and sets it at boot. /var is a tmpfs, so that directory lives on the data
# partition, otherwise every boot starts at the build date (TLS to GitHub fails until NTP).
[Unit]
RequiresMountsFor=/data
After=systemd-tmpfiles-setup.service

[Service]
StateDirectory=
BindPaths=/data/timesync:/var/lib/systemd/timesync
ReadWritePaths=/data/timesync
