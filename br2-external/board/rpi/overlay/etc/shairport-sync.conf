// AroioOS: AirPlay 2 into the ALSA loopback, CamillaDSP does the rest.
general = {
  name = "Aroio";
  interpolation = "soxr";
  output_backend = "alsa";
  ignore_volume_control = "yes";     // the Aroio volume stays in charge
};
sessioncontrol = {
  run_this_before_play_begins = "/usr/bin/aroio-event airplay start 44100";
  run_this_after_play_ends = "/usr/bin/aroio-event airplay stop";
  allow_session_interruption = "yes";
  session_timeout = 20;
};
alsa = {
  output_device = "hw:Loopback,0,0";
  output_format = "S32";
  output_rate = 44100;
};
