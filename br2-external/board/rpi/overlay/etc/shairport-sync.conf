// AroioOS: AirPlay 2 into the ALSA loopback, CamillaDSP does the rest.
general = {
  name = "Aroio";
  interpolation = "basic";          // this build has no soxr; AirPlay 2 ignores it anyway
  output_backend = "alsa";
  ignore_volume_control = "yes";     // the Aroio volume stays in charge
};
sessioncontrol = {
  allow_session_interruption = "yes";
  session_timeout = 20;
};
// start/stop, title, artist, album and cover go to aroiod through this pipe (aroiod/airplay_meta.py)
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/run/shairport-sync/metadata";
  progress_interval = 0;
};
alsa = {
  output_device = "plughw:Loopback,0,0";
  output_format = "S32";
  output_rate = 44100;
};
