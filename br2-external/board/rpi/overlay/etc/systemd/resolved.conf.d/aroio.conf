# Avahi announces the Aroio (aroio.local, AirPlay, Spotify, UPnP). A second mDNS stack in
# systemd-resolved makes both unreliable ("Detected another IPv4 mDNS stack").
[Resolve]
MulticastDNS=no
LLMNR=no
# plain DNS from the DHCP server: company and home DNS servers often do not answer DNSSEC or
# DNS over TLS, and resolved's downgrade attempts make lookups fail ("Name or service not
# known" for updates and Spotify); no public fallback servers next to the network's own
DNSSEC=no
DNSOverTLS=no
FallbackDNS=
