# Aroio: PulseAudio only carries Spotify Soloist into the loopback (aroio-pulse.service).
# Spotify streams 44.1 kHz: no resampling, 32 bit into the loopback, volume stays with the Aroio.
default-sample-format = s32le
default-sample-rate = 44100
alternate-sample-rate = 48000
avoid-resampling = yes
flat-volumes = no
exit-idle-time = -1
realtime-scheduling = yes
