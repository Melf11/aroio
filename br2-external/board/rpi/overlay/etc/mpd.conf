# AroioOS: MPD only serves upmpdcli (UPnP/OpenHome renderer). No library here,
# that is Lyrion's job. Output into the ALSA loopback, CamillaDSP does the rest.
state_file          "/var/lib/mpd/state"
bind_to_address     "127.0.0.1"
port                "6600"
restore_paused      "yes"
replaygain          "off"
volume_normalization "no"

audio_output {
    type            "alsa"
    name            "Aroio"
    device          "hw:Loopback,0,0"
    mixer_type      "none"
    auto_resample   "no"
    auto_format     "no"
}
