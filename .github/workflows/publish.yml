# Publish a finished, tested build as a release, without building again:
# Actions › "Release veröffentlichen" › Run workflow, with the link (or number) of an
# "Image bauen" run that was started with a version. Takes about a minute.
name: Release veröffentlichen

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Link oder Nummer des Laufs „Image bauen“ (mit Versionsnummer gebaut)"
        required: true
      notes:
        description: "Neuerungen für die App, getrennt mit ;"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build holen
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
        run: |
          RUN=$(printf '%s' "$BUILD" | grep -oE '[0-9]{6,}' | head -1)
          [ -n "$RUN" ] || { echo "::error::Keine Laufnummer in „$BUILD“"; exit 1; }
          INFO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN")
          [ "$(echo "$INFO" | jq -r .conclusion)" = success ] || { echo "::error::Lauf $RUN ist nicht erfolgreich durchgelaufen"; exit 1; }
          NAME=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" -q '.artifacts[] | select(.name | startswith("aroio-")) | select(.expired | not) | .name' | head -1)
          [ -n "$NAME" ] || { echo "::error::Lauf $RUN hat kein (nicht abgelaufenes) Image. Builds werden 30 Tage aufgehoben."; exit 1; }
          gh run download "$RUN" -n "$NAME" -D build
          ls -l build
          V=$(jq -r .version build/release.json)
          if [ -z "$V" ] || ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Dieser Build hat keine Versionsnummer (Testbuild). Die Version steckt im Image: bitte „Image bauen“ mit Version starten."; exit 1
          fi
          if gh release view "v$V" >/dev/null 2>&1; then echo "::error::Release v$V gibt es schon"; exit 1; fi
          (cd build && sha256sum -c SHA256SUMS)
          echo "V=$V" >> "$GITHUB_ENV"
          echo "SHA=$(jq -r .sha build/release.json)" >> "$GITHUB_ENV"
          echo "PRE=$(jq -r .prerelease build/release.json)" >> "$GITHUB_ENV"
          echo "Veröffentlicht wird Lauf $RUN: AroioOS $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tools/release-notes.sh "$V" "$NOTES" > notes.md
          cat notes.md
          gh release create "v$V" build/aroio-*.img.xz build/aroio-*.raucb build/SHA256SUMS \
            --target "$SHA" --title "AroioOS $V" --notes-file notes.md $([ "$PRE" = true ] && echo --prerelease)
